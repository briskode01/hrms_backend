services:
  mongodb:
    image: mongo:7
    container_name: hrms_mongo
    restart: always
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - hrms_network

  backend:
    build: .
    container_name: hrms_backend
    restart: always
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/admin?authSource=admin
    networks:
      - hrms_network

volumes:
  mongo_data:

networks:
  hrms_network:
    driver: bridge
